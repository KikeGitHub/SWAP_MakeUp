<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="gBall" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#e6e6e6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cfcfcf" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base sphere -->
  <g filter="url(#s)">
    <circle cx="100" cy="100" r="92" fill="url(#gBall)" stroke="#bfbfbf" stroke-width="1"/>
  </g>

  <!-- Panels approximation: central pentagon + surrounding shapes -->
  <g transform="translate(100,100)">
    <!-- central pentagon -->
    <polygon points="0,-36 34,-12 21,30 -21,30 -34,-12" fill="#ffffff" stroke="#b7b7b7" stroke-width="1.8"/>

    <!-- surrounding dark panels (approx) -->
    <g fill="#0b0b0b" stroke="#111" stroke-width="1">
      <g transform="rotate(0)">
        <polygon points="0,-36 34,-12 20,-46 -20,-46 -34,-12" opacity="1"/>
      </g>
      <g transform="rotate(72)">
        <polygon points="0,-36 34,-12 20,-46 -20,-46 -34,-12" opacity="1"/>
      </g>
      <g transform="rotate(144)">
        <polygon points="0,-36 34,-12 20,-46 -20,-46 -34,-12" opacity="1"/>
      </g>
      <g transform="rotate(216)">
        <polygon points="0,-36 34,-12 20,-46 -20,-46 -34,-12" opacity="1"/>
      </g>
      <g transform="rotate(288)">
        <polygon points="0,-36 34,-12 20,-46 -20,-46 -34,-12" opacity="1"/>
      </g>
    </g>

    <!-- light bevels on panels to mimic shading -->
    <g fill="#ffffff" opacity="0.08">
      <path d="M-34,-12 L-21,30 L-6,14 L-18,-6 Z"/>
      <path d="M34,-12 L21,30 L6,14 L18,-6 Z"/>
    </g>

  </g>

  <!-- subtle outer rim highlight -->
  <ellipse cx="100" cy="66" rx="60" ry="18" fill="rgba(255,255,255,0.12)"/>
</svg>
