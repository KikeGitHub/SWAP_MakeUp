<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Favicon MA">
  <defs>
    <filter id="gold-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#000" />
  <g font-family="'Playfair Display', Georgia, serif" font-weight="700">
    <text x="96" y="162" font-size="140" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">M</text>
    <text x="160" y="162" font-size="140" fill="#b8935a" text-anchor="middle" dominant-baseline="middle" filter="url(#gold-glow)">A</text>
  </g>
</svg>
